<section class="preview section" id="preview">
  <div class="section-label">TAKE A CLOSER LOOK</div>

  <div class="preview-heading">
    <h2>From concept<br />to <span>experience.</span></h2>
    <p>Explore the MatchFinder interface and see how its visual system comes together.</p>
  </div>

  <div class="browser">
    <div class="browser-bar">
      <div class="browser-dots"><span></span><span></span><span></span></div>
      <div class="browser-address">matchfinder / application preview</div>
      <span class="browser-tag">PROJECT PREVIEW</span>
    </div>

    <div class="screenshot">
      <img [src]="previewImage" alt="MatchFinder application screenshot" loading="lazy" />
      <div class="image-fallback">
        <span>MF</span>
        <p>MatchFinder application preview</p>
      </div>
    </div>
  </div>

  <div class="preview-bottom">
    <div><span class="live-dot"></span> Application interface preview</div>
    <a [href]="repositoryUrl" target="_blank" rel="noopener noreferrer">
      Explore repository <span>↗</span>
    </a>
  </div>
</section>
